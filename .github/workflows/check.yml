name: Reproduction smoke check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: deepspy-train --config configs/benchmark_450ep_t050.yml --validate-only
      - run: deepspy-evaluate --help
